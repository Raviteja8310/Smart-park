services:
  db:
    image: mysql:8.4
    container_name: smartpark-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: smartpark
      MYSQL_USER: smartpark_app
      MYSQL_PASSWORD: root
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - smartpark_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s

volumes:
  smartpark_mysql_data:
