services:
  db:
    image: mysql:8.4
    container_name: smartpark-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local_root_change_me}
      MYSQL_DATABASE: ${DB_NAME:-smartpark}
      MYSQL_USER: ${DB_USER:-smartpark_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_this_local_password}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - smartpark_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s

volumes:
  smartpark_mysql_data:
